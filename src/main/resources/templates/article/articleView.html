<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:include="~{fragments/head}"></th:block>
</head>
<body>
<header>
  <th:block th:include="~{fragments/navbar}"></th:block>
</header>
<main class="mt-3">
  <hr class="hr-2 bg-dark w-25">
  <form id="add-articleEntity-form" class="form w-25 mx-auto" th:action="@{/articles/edit/{id}(id=${articleEntity.id})}" th:object="${articleEntity.id}" method="post"
        enctype="multipart/form-data"><input type="hidden" name="_csrf" value="c686cd14-a7f9-4216-8009-c093b7d3df86">
    <input type="hidden" name="id"  th:value="${articleEntity.id}">
    <div class="form-group">
      <label for="add-article_title" class="font-weight-bold">Title</label>
      <input type="text" th:value="${articleEntity.title}" class="form-control text-center" id="add-article_title" name="title">
    </div>
    <div class="form-group">
      <label for="add-articleEntity-description" class="font-weight-bold">Description</label>
      <input type="text" th:value="${articleEntity.description}" class="form-control text-center" id="add-articleEntity-description" name="description">
    </div>
    <div class="form-group">
      <label for="add-articleEntity-text" class="font-weight-bold">Text</label>
      <input type="text" th:value="${articleEntity.longText}" class="form-control text-center" id="add-articleEntity-text" name="longText">
    </div>
    <div class="form-group">
      <label for="add-articleEntity-workaround" class="font-weight-bold">Workaround</label>
      <input type="text" th:value="${articleEntity.workaround}" class="form-control text-center" id="add-articleEntity-workaround" name="workaround">
    </div>

    <hr class="hr-2 bg-dark w-25">
    <div th:if="${articleEntity.author.id}==${userid} or ${#authorization.expression('hasAuthority(''EDITOR_ROLE'')')}" class="button-holder d-flex justify-content-center">
      <button type="submit" class="btn btn-success">Edit</button>
    </div>
  </form>
</main>
<footer>
  <th:block th:include="~{fragments/footer}"></th:block>
</footer>
</body>
</html>
